<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-4399c03a-9f4b-4984-9910-2abd12203abd/styles.css">
<script src="_ds/organic-4399c03a-9f4b-4984-9910-2abd12203abd/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="site.css">
</helmet>

<div style="position: sticky; top: 0; z-index: 60;">

  <a href="#main" data-skip-link>Skip to content</a>

  <!-- SEASONAL ANNOUNCEMENT: currently switched off.
       To turn it back on, change  showBanner = false  to  showBanner = true
       in this file's script, then edit the line of text below.            -->
  <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ false }}">
    <div style="background: var(--berry); color: var(--color-bg); text-align: center; padding: 8px 18px; font-family: var(--font-body); font-size: 14px; line-height: 1.4;">
      <strong style="font-weight: 700;">Now in season:</strong> peach preserves and apricot jelly, while the fruit lasts.
    </div>
  </sc-if>

  <header style="background: color-mix(in srgb, var(--cream) 94%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hairline);">
    <div style="max-width: 1240px; margin: 0 auto; padding: 10px clamp(16px, 4vw, 44px); display: flex; align-items: center; gap: clamp(12px, 2vw, 28px);">

      <a href="Sugarberry%20Cottage.dc.html" style="display: block; flex: 0 0 auto; line-height: 0;">
        <img src="images/logo-horizontal.png" alt="Sugarberry Cottage, home" style="height: clamp(34px, 5.2vw, 56px); width: auto; display: block;">
      </a>

      <nav aria-label="Main" data-nav-links style="margin-left: auto; align-items: center; gap: clamp(14px, 1.9vw, 30px); font-family: var(--font-body); font-size: 15px; white-space: nowrap;">
        <a href="Sugarberry%20Cottage.dc.html" data-current="{{ curHome }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">Home</a>
        <a href="Products.dc.html" data-current="{{ curProducts }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">Our Products</a>
        <a href="About.dc.html" data-current="{{ curAbout }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">About Us</a>
        <a href="Order.dc.html" data-current="{{ curOrder }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">How to Order</a>
        <a href="FAQ.dc.html" data-current="{{ curFaq }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">FAQ</a>
        <a href="Contact.dc.html" data-current="{{ curContact }}" style="color: var(--ink); text-decoration: none; padding: 6px 0;" style-hover="{{ linkHover }}">Contact</a>
      </nav>

      <a class="btn" href="Order.dc.html" data-nav-cta style="background: var(--berry); color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 11px 20px; white-space: nowrap; flex: 0 0 auto;" style-hover="{{ ctaHover }}">Order Now</a>

      <button type="button" data-nav-toggle aria-controls="cottage-menu" aria-expanded="{{ expanded }}" onClick="{{ toggle }}" style="margin-left: auto; width: 46px; height: 46px; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--hairline); border-radius: 999px; color: var(--berry); cursor: pointer; flex: 0 0 auto;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Menu</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
      </button>
    </div>

    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <nav id="cottage-menu" aria-label="Main" style="border-top: 1px solid var(--hairline); background: var(--cream); padding: 10px clamp(16px, 4vw, 44px) 18px; display: flex; flex-direction: column; font-family: var(--font-body); font-size: 17px;">
        <a href="Sugarberry%20Cottage.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px; border-bottom: 1px solid var(--hairline);">Home</a>
        <a href="Products.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px; border-bottom: 1px solid var(--hairline);">Our Products</a>
        <a href="About.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px; border-bottom: 1px solid var(--hairline);">About Us</a>
        <a href="Order.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px; border-bottom: 1px solid var(--hairline);">How to Order</a>
        <a href="FAQ.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px; border-bottom: 1px solid var(--hairline);">FAQ</a>
        <a href="Contact.dc.html" onClick="{{ close }}" style="color: var(--ink); text-decoration: none; padding: 13px 4px;">Contact</a>
        <a class="btn" href="Order.dc.html" onClick="{{ close }}" style="background: var(--berry); color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 15px; padding: 13px 22px; margin-top: 12px; align-self: flex-start;">Order Now</a>
      </nav>
    </sc-if>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:170},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;products&quot;,&quot;about&quot;,&quot;order&quot;,&quot;faq&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  /* ══ SEASONAL BANNER ═════════════════════════════════════════════════
     false = hidden. Change to true when you want the announcement strip
     back across the top of every page, then edit its wording in the
     template above.                                                     */
  showBanner = false;

  state = { open: false };
  renderVals() {
    const cur = this.props.current || '';
    const mark = (key) => (cur === key ? 'page' : null);
    return {
      showBanner: this.showBanner,
      open: this.state.open,
      expanded: this.state.open ? 'true' : 'false',
      toggle: () => this.setState((s) => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      linkHover: { color: 'var(--berry)' },
      ctaHover: { background: 'var(--berry-deep)' },
      curHome: mark('home'),
      curProducts: mark('products'),
      curAbout: mark('about'),
      curOrder: mark('order'),
      curFaq: mark('faq'),
      curContact: mark('contact')
    };
  }
}
</script>
</body>
</html>
